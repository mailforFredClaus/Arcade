<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="theme-color" content="#b8d0f5">
  <title>Gem Swap</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="../../shared/screen.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" aria-label="Gem Swap board"></canvas>

  <header class="topbar" id="topbar">
    <a class="sq-btn" href="../../index.html" aria-label="Back to the arcade" id="backBtn"></a>
    <div class="banner">
      <div class="moves" aria-label="Moves left"><span class="moves-label">MOVES</span><span class="moves-num" id="moves">0</span></div>
      <div class="lvl"><span id="levelLabel">LEVEL 1</span><span class="tier-tag" id="tierTag"></span></div>
    </div>
    <button class="sq-btn" id="menuBtn" aria-label="Settings"></button>
  </header>

  <div class="goals" id="goals" aria-label="Goals"></div>

  <nav class="tools" id="tools">
    <button class="tool" id="hammerBtn" aria-label="Hammer: smash one square">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 6.5 4 16a2.1 2.1 0 0 0 3 3l9.5-9.5"/><path d="m12 5 3.2-3.2a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L19 12z" fill="currentColor"/></svg>
      <span>Hammer</span><span class="badge" id="hammerBadge">1</span>
    </button>
    <button class="tool" id="rowBtn" aria-label="Row blast: clear one row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="m7 7-5 5 5 5M17 7l5 5-5 5"/></svg>
      <span>Row</span><span class="badge" id="rowBadge">1</span>
    </button>
    <button class="tool" id="shuffleBtn" aria-label="Shuffle the gems">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4c4 0 6 10 10 10h4M3 17h4c1.6 0 2.8-1.5 3.9-3.4M13.1 9.4C14.2 8.5 15.4 7 17 7h4"/><path d="m18 4 3 3-3 3M18 14l3 3-3 3"/></svg>
      <span>Shuffle</span><span class="badge" id="shuffleBadge">1</span>
    </button>
    <button class="tool" id="hintBtn"><span class="ico" data-icon="hint"></span><span>Hint</span></button>
  </nav>

  <canvas id="fx" class="fx"></canvas>
  <div class="loading hide" id="loading"><div class="spinner"></div><div id="loadingText">Building level…</div></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script type="module" src="js/game.js"></script>
</body>
</html>
