<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="theme-color" content="#2a7fe6">
  <title>Honey Run</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="../../shared/screen.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" aria-label="Honey Run"></canvas>

  <!-- While running: score, coins, power-ups and pause. -->
  <div class="hud" id="hud" hidden>
    <button class="round" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.500" height="14" rx="1.500"/><rect x="13.500" y="5" width="4.500" height="14" rx="1.500"/></svg>
    </button>
    <div class="tally">
      <div class="score"><span id="score">0</span><b class="mult" id="mult">×1</b></div>
      <div class="purse"><i class="hex"></i><span id="coins">0</span></div>
    </div>
    <div class="powers" id="powers"></div>
  </div>
  <div class="callout" id="callout"></div>
  <div class="tips" id="tips" hidden>
    <div><b>← →</b> change lane</div><div><b>↑</b> jump</div><div><b>↓</b> roll</div>
  </div>

  <!-- Before a run. -->
  <div class="title" id="title">
    <div class="title-top">
      <a class="round" href="../../index.html" aria-label="Back to the arcade" id="backBtn"></a>
      <div class="purse big"><i class="hex"></i><span id="bank">0</span></div>
      <button class="round" id="menuBtn" aria-label="Settings"></button>
    </div>
    <h1 class="logo"><span>Honey</span><span>Run</span></h1>
    <div class="best-pill" id="bestLine"></div>
    <div class="go" id="goHint">Tap to run</div>
    <div class="title-bottom">
      <button class="pill-btn" id="shopBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h16l-1.300 11.200A2 2 0 0 1 16.700 21H7.300a2 2 0 0 1-2-1.800z"/><path d="M8.500 9V7a3.500 3.500 0 0 1 7 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Shop</span></button>
      <button class="pill-btn" id="goalsBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.600l2.850 5.800 6.400.930-4.630 4.500 1.100 6.370L12 17.200l-5.720 3 1.100-6.370-4.630-4.500 6.400-.930z"/></svg><span>Goals</span><b id="goalsMult">×1</b></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script type="module" src="js/game.js"></script>
</body>
</html>
