<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="theme-color" content="#b8d0f5">
  <title>Arrow Cube</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" aria-label="Arrow Cube puzzle"></canvas>

  <div id="loading" class="loading hide" aria-live="polite">
    <div class="spinner"></div>
    <div id="loadingText">Building level…</div>
  </div>

  <header class="topbar">
    <a class="sq-btn" href="../../index.html" aria-label="Back to the arcade">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 7.5 12l7 7"/></svg>
    </a>
    <div class="banner">
      <div class="stars" id="stars"></div>
      <div class="progress" id="progress" hidden><div class="bar"><i id="progressFill"></i></div><span id="progressText">0%</span></div>
      <div class="lvl"><span id="levelLabel">LEVEL 1</span><span class="tier-tag" id="tierTag"></span></div>
    </div>
    <button class="sq-btn" id="menuBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="3.6" stroke-dasharray="2.9 2.9"/><circle cx="12" cy="12" r="6.2" fill="currentColor"/><circle cx="12" cy="12" r="2.5" class="gear-hole"/></svg>
    </button>
  </header>

  <div class="counter" id="counter" aria-label="Arrows left">
    <svg viewBox="0 0 24 24"><path d="M12 2.5 20 11h-5v10.5H9V11H4z" fill="currentColor"/></svg>
    <span id="count">0</span>
  </div>

  <nav class="tools" id="tools">
    <button class="tool" id="hintBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4a6.6 6.6 0 0 0-4 11.9c.7.5 1.1 1.3 1.1 2.1v.9h5.8v-.9c0-.8.4-1.6 1.1-2.1A6.6 6.6 0 0 0 12 2.4z"/><rect x="9.1" y="18.6" width="5.8" height="2.9" rx="1.3"/></svg>
      <span>Hint</span>
    </button>
    <button class="tool" id="undoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 4.5 4 9l4.5 4.5"/><path d="M4.5 9H14a5.5 5.5 0 0 1 0 11h-3.5"/></svg>
      <span>Undo</span>
    </button>
    <button class="tool" id="viewBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path d="m12 8 3.5 2v4L12 16l-3.5-2v-4z" fill="currentColor" stroke-width="1.5"/></svg>
      <span>Recenter</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script type="module" src="js/game.js"></script>
</body>
</html>
