<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="theme-color" content="#b8d0f5">
  <title>Hexit</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="../../shared/screen.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" aria-label="Hexit board"></canvas>

  <header class="topbar" id="topbar">
    <a class="sq-btn" href="../../index.html" aria-label="Back to the arcade" id="backBtn"></a>
    <div class="banner">
      <div class="hearts" id="hearts" aria-label="Hearts left"></div>
      <div class="progress" id="progress" hidden><div class="bar"><i id="progressFill"></i></div><span id="progressText">0%</span></div>
      <div class="lvl"><span id="levelLabel">LEVEL 1</span><span class="tier-tag" id="tierTag"></span></div>
    </div>
    <button class="sq-btn" id="menuBtn" aria-label="Settings"></button>
  </header>

  <div class="counter" id="counter"><b id="count">0</b> <span>tiles left</span></div>

  <nav class="tools" id="tools">
    <button class="tool" id="undoBtn"><span class="ico" data-icon="undo"></span><span>Undo</span></button>
    <button class="tool" id="hintBtn"><span class="ico" data-icon="hint"></span><span>Hint</span></button>
    <button class="tool" id="fitBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span>Fit</span>
    </button>
  </nav>

  <div class="loading hide" id="loading"><div class="spinner"></div><div id="loadingText">Building level…</div></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script type="module" src="js/game.js"></script>
</body>
</html>
