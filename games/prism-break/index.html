<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="theme-color" content="#1b2a6b">
  <title>Prism Break</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="../../shared/screen.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" aria-label="Prism Break"></canvas>

  <!-- While playing. -->
  <div class="hud" id="hud" hidden>
    <button class="round" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.500" height="14" rx="1.500"/><rect x="13.500" y="5" width="4.500" height="14" rx="1.500"/></svg>
    </button>
    <div class="where"><b id="levelLabel">LEVEL 1</b><span id="levelName"></span></div>
    <div class="tally"><b id="score">0</b><div class="lives" id="lives" aria-label="Lives"></div></div>
  </div>
  <div class="powers" id="powers"></div>
  <div class="callout" id="callout"></div>

  <!-- Before playing. -->
  <div class="title" id="title">
    <div class="title-top">
      <a class="round" href="../../index.html" aria-label="Back to the arcade" id="backBtn"></a>
      <div class="stars-total"><svg viewBox="0 0 24 24"><path d="M12 2.600l2.850 5.800 6.400.930-4.630 4.500 1.100 6.370L12 17.200l-5.720 3 1.100-6.370-4.630-4.500 6.400-.930z"/></svg><span id="starTotal">0</span></div>
      <button class="round" id="menuBtn" aria-label="Settings"></button>
    </div>
    <h1 class="logo"><span>PRISM</span><span>BREAK</span></h1>
    <div class="title-actions">
      <button class="big-btn" id="playBtn"><span id="playLabel">Play</span><small id="playSub"></small></button>
      <button class="soft-btn" id="levelsBtn">Levels</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script type="module" src="js/game.js"></script>
</body>
</html>
