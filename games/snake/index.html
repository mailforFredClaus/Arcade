<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="theme-color" content="#b6e3d6">
  <title>Snake</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="../../shared/screen.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-teal">
  <canvas id="stage" aria-label="Snake board"></canvas>

  <header class="topbar" id="topbar">
    <a class="sq-btn" href="../../index.html" aria-label="Back to the arcade" id="backBtn"></a>
    <div class="banner">
      <div class="stat" aria-label="Score">
        <svg viewBox="0 0 20 24"><path d="M10 7.500c-2.200-1.600-7-.6-7 5 0 4.400 2.900 8 5.200 8 .8 0 1.200-.4 1.800-.4s1 .4 1.800.4c2.300 0 5.200-3.600 5.200-8 0-5.600-4.800-6.600-7-5z" fill="#ff5a5f"/><path d="M10 7.500c0-2 .8-3.600 2.600-4.500" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round"/></svg>
        <span id="score">0</span>
      </div>
      <div class="lvl"><span id="bestLabel">BEST 0</span><span class="tier-tag" id="modeTag"></span></div>
    </div>
    <button class="sq-btn" id="menuBtn" aria-label="Pause and settings"></button>
  </header>

  <div class="foot" id="foot"></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script type="module" src="js/game.js"></script>
</body>
</html>
