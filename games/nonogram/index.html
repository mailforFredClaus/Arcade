<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="theme-color" content="#b8d0f5">
  <title>Nonogram</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="stylesheet" href="../../shared/screen.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" aria-label="Nonogram puzzle"></canvas>

  <header class="topbar" id="topbar">
    <a class="sq-btn" href="../../index.html" aria-label="Back to the arcade" id="backBtn"></a>
    <div class="banner">
      <div class="stat" aria-label="Time">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        <span id="timer">0:00</span>
      </div>
      <div class="lvl"><span id="levelLabel">EASY 1</span><span class="tier-tag" id="tierTag"></span></div>
    </div>
    <button class="sq-btn" id="menuBtn" aria-label="Settings"></button>
  </header>

  <nav class="tools" id="tools">
    <button class="tool" id="markBtn" aria-label="Switch between filling and crossing out">
      <span class="mark-ico" id="markIco"></span>
      <span id="markLabel">Fill</span>
    </button>
    <button class="tool" id="undoBtn"><span class="ico" data-icon="undo"></span><span>Undo</span></button>
    <button class="tool" id="hintBtn"><span class="ico" data-icon="hint"></span><span>Hint</span></button>
    <button class="tool" id="viewBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span>Fit</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script type="module" src="js/game.js"></script>
</body>
</html>
